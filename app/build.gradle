plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sliva.clicker'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sliva.clicker'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    androidResources {
        noCompress 'mp4', 'jpg'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
