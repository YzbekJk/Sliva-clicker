name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Kussia88 кликер (текущий код)
      - name: Build Kussia88 clicker
        run: gradle assembleDebug --no-daemon

      # Слива кликер (первая версия, из коммита 773a427), другой applicationId, чтобы ставились оба
      - name: Build Sliva clicker
        run: |
          git worktree add ../plum 773a427
          cp app/debug.keystore ../plum/app/debug.keystore
          cp app/build.gradle ../plum/app/build.gradle
          sed -i "s/applicationId 'com.sliva.clicker'/applicationId 'com.sliva.plum'/" ../plum/app/build.gradle
          gradle -p ../plum assembleDebug --no-daemon

      - name: Prepare site
        run: |
          mkdir -p public/apks
          cp -r site/. public/
          cp app/build/outputs/apk/debug/app-debug.apk public/apks/kussia88-clicker.apk
          cp ../plum/app/build/outputs/apk/debug/app-debug.apk public/apks/sliva-clicker.apk
          python3 - <<'EOF'
          import json, os
          p = 'public/apps.json'
          apps = json.load(open(p, encoding='utf-8'))
          for a in apps:
              f = os.path.join('public', a['file'])
              if os.path.exists(f):
                  a['size_mb'] = round(os.path.getsize(f) / 1048576, 1)
          json.dump(apps, open(p, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print(apps)
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
