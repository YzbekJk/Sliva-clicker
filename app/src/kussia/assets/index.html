<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kussia88 кликер</title>
<style>
  :root {
    --bg: #0d0d0d;
    --card: rgba(255,255,255,.07);
    --card-hi: rgba(255,255,255,.13);
    --text: #f4f4f4;
    --muted: #9a9a9a;
    --accent: #ffb703;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  #app {
    height: 100dvh; max-width: 560px; margin: 0 auto;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 14px env(safe-area-inset-bottom);
  }
  header { text-align: center; padding: 12px 0 2px; }
  #count { font-size: 42px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
  .label { font-size: 14px; color: var(--muted); margin-top: 2px; }
  #ps { font-size: 13.5px; color: var(--accent); margin-top: 6px; font-weight: 600; }

  main { flex: 1 1 auto; min-height: 150px; display: flex; align-items: center; justify-content: center; }
  /* Окно стримера: фон у видео совпадает с фоном страницы, поэтому границ не видно */
  #stage {
    position: relative; width: 100%; max-width: 480px; aspect-ratio: 480 / 280;
    max-height: 100%; cursor: pointer; background: var(--bg);
    transition: transform .08s ease-out;
  }
  #stage.hit { transform: scale(.975); }
  #stage video, #stage img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
    background: var(--bg); pointer-events: none; display: block;
  }
  .vid { visibility: hidden; }
  .vid.on { visibility: visible; }
  #stage.playing #idle { visibility: hidden; }
  #tip {
    position: absolute; left: 0; right: 0; bottom: 6px; text-align: center;
    font-size: 12px; color: rgba(255,255,255,.55); pointer-events: none;
    text-shadow: 0 1px 4px rgba(0,0,0,.9);
  }
  #stage.playing #tip { visibility: hidden; }

  .float {
    position: fixed; pointer-events: none; z-index: 10;
    font-weight: 800; font-size: 24px; color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,.8);
    animation: floatUp .8s ease-out forwards;
  }
  @keyframes floatUp {
    from { opacity: 1; transform: translate(-50%, -50%); }
    to   { opacity: 0; transform: translate(-50%, -120px); }
  }

  #shop {
    flex: 0 1 40%; overflow-y: auto; padding: 4px 0 8px;
    display: flex; flex-direction: column; gap: 8px;
    -webkit-overflow-scrolling: touch;
  }
  .up {
    display: flex; align-items: center; gap: 12px; width: 100%;
    background: var(--card); color: var(--text);
    border: 1px solid transparent; border-radius: 14px;
    padding: 10px 12px; text-align: left; font: inherit; cursor: pointer;
  }
  .up:active:not(:disabled) { background: var(--card-hi); }
  .up:disabled { opacity: .45; cursor: default; }
  .up.can { border-color: rgba(255,183,3,.55); }
  .ic { font-size: 26px; width: 36px; text-align: center; flex: none; }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 700; font-size: 15px; }
  .desc { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .right { text-align: right; flex: none; }
  .cost { font-weight: 800; font-size: 15px; color: var(--accent); }
  .lv { font-size: 12px; color: var(--muted); margin-top: 1px; }

  footer { text-align: center; padding: 2px 0 10px; }
  #reset {
    background: none; border: 0; color: var(--muted); font: inherit; font-size: 12px;
    text-decoration: underline; padding: 6px 10px; cursor: pointer;
  }
  #toast {
    position: fixed; left: 50%; top: 14px; transform: translate(-50%, -120%);
    background: #fff; color: #111; padding: 10px 16px; border-radius: 12px;
    font-weight: 600; font-size: 14px; z-index: 20; max-width: 90vw; text-align: center;
    transition: transform .35s ease, opacity .35s ease; box-shadow: 0 8px 24px rgba(0,0,0,.5);
    opacity: 0; pointer-events: none;
  }
  #toast.show { transform: translate(-50%, 0); opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="count">0</div>
    <div class="label">очков</div>
    <div id="ps">0 в секунду</div>
  </header>

  <main>
    <div id="stage" role="button" aria-label="Kussia88">
      <img id="idle" src="streamer.jpg" alt="">
      <video id="v0" class="vid" playsinline webkit-playsinline preload="auto" poster="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="></video>
      <video id="v1" class="vid" playsinline webkit-playsinline preload="auto" poster="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="></video>
      <div id="tip">жми на него</div>
    </div>
  </main>

  <section id="shop" aria-label="Улучшения"></section>

  <footer><button id="reset">Сбросить прогресс</button></footer>
</div>
<div id="toast"></div>

<script>
(function () {
  'use strict';

  var KEY = 'kussia88-clicker-v1';
  var OFFLINE_CAP_SEC = 2 * 60 * 60;
  var OFFLINE_RATE = 0.5;

  // Мем-клипы (assets/clips/m01.mp4 ... mNN.mp4). Чтобы добавить новые, положите файл в папку
  // и увеличьте CLIPS.
  var CLIPS = 55;

  var UPGRADES = [
    { id: 'hand',   icon: '👆', name: 'Мощный клик',   desc: '+1 очко за клик',       base: 15,     click: 1, sec: 0 },
    { id: 'sub',    icon: '🙋', name: 'Подписчик',     desc: '+1 очко в секунду',     base: 50,     click: 0, sec: 1 },
    { id: 'mod',    icon: '🛡️', name: 'Модератор',     desc: '+8 очков в секунду',    base: 400,    click: 0, sec: 8 },
    { id: 'donate', icon: '💸', name: 'Донат',         desc: '+50 очков в секунду',   base: 3000,   click: 0, sec: 50 },
    { id: 'studio', icon: '🎙️', name: 'Студия',        desc: '+300 очков в секунду',  base: 20000,  click: 0, sec: 300 },
    { id: 'empire', icon: '🏆', name: 'Стрим-империя', desc: '+2000 очков в секунду', base: 150000, click: 0, sec: 2000 }
  ];

  function fresh() { return { pts: 0, total: 0, levels: {}, t: Date.now() }; }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && typeof s.pts === 'number' && isFinite(s.pts)) {
          s.total = typeof s.total === 'number' ? s.total : s.pts;
          s.levels = s.levels || {};
          s.t = typeof s.t === 'number' ? s.t : Date.now();
          return s;
        }
      }
    } catch (e) {}
    return fresh();
  }

  var state = load();

  function save() {
    state.t = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function lvl(id) { return state.levels[id] || 0; }
  function perClick() { var c = 1; UPGRADES.forEach(function (u) { c += u.click * lvl(u.id); }); return c; }
  function perSec()   { var s = 0; UPGRADES.forEach(function (u) { s += u.sec * lvl(u.id); }); return s; }
  function cost(u)    { return Math.floor(u.base * Math.pow(1.15, lvl(u.id))); }

  var UNITS = ['', ' тыс.', ' млн', ' млрд', ' трлн', ' квдрлн'];
  function fmt(n) {
    n = Math.floor(n);
    if (n < 1000) return String(n);
    var i = Math.min(Math.floor(Math.log10(n) / 3), UNITS.length - 1);
    var v = n / Math.pow(1000, i);
    var s = v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2);
    return s.replace(/\.?0+$/, '').replace('.', ',') + UNITS[i];
  }

  // ---------- DOM ----------
  var elCount = document.getElementById('count');
  var elPs = document.getElementById('ps');
  var elStage = document.getElementById('stage');
  var vids = [document.getElementById('v0'), document.getElementById('v1')];
  var cur = 0;
  var elShop = document.getElementById('shop');
  var elToast = document.getElementById('toast');
  var rows = {};

  UPGRADES.forEach(function (u) {
    var b = document.createElement('button');
    b.className = 'up';
    b.innerHTML =
      '<div class="ic">' + u.icon + '</div>' +
      '<div class="info"><div class="name">' + u.name + '</div><div class="desc">' + u.desc + '</div></div>' +
      '<div class="right"><div class="cost"></div><div class="lv"></div></div>';
    b.addEventListener('click', function () { buy(u); });
    elShop.appendChild(b);
    rows[u.id] = { btn: b, cost: b.querySelector('.cost'), lv: b.querySelector('.lv') };
  });

  function buy(u) {
    var c = cost(u);
    if (state.pts < c) return;
    state.pts -= c;
    state.levels[u.id] = lvl(u.id) + 1;
    render();
    save();
  }

  function render() {
    elCount.textContent = fmt(state.pts);
    elPs.textContent = fmt(perSec()) + ' в секунду · ' + fmt(perClick()) + ' за клик';
    UPGRADES.forEach(function (u) {
      var r = rows[u.id], c = cost(u), ok = state.pts >= c;
      r.cost.textContent = fmt(c);
      r.lv.textContent = 'ур. ' + lvl(u.id);
      r.btn.disabled = !ok;
      r.btn.classList.toggle('can', ok);
    });
  }

  function floatText(x, y, text) {
    var d = document.createElement('div');
    d.className = 'float';
    d.textContent = '+' + text;
    d.style.left = x + 'px';
    d.style.top = y + 'px';
    document.body.appendChild(d);
    setTimeout(function () { d.remove(); }, 850);
  }

  var toastTimer;
  function toast(msg) {
    elToast.textContent = msg;
    elToast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { elToast.classList.remove('show'); }, 3500);
  }

  // ---------- Мем-клипы ----------
  var lastClip = -1;
  var playing = false;

  function pickClip() {
    var n;
    do { n = Math.floor(Math.random() * CLIPS) + 1; } while (CLIPS > 1 && n === lastClip);
    lastClip = n;
    return n;
  }

  var playToken = 0;
  var pending = false; // следующий клип уже грузится

  function stopClip() {
    playing = false;
    elStage.classList.remove('playing');
    vids[0].classList.remove('on');
    vids[1].classList.remove('on');
  }

  // Следующий клип грузится в скрытый плеер, а текущий доигрывает.
  // Переключение происходит, когда новый реально пошёл, поэтому заглушек не видно.
  function playRandomClip() {
    if (pending) return; // клики во время загрузки не сбрасывают её
    pending = true;
    var n = pickClip();
    var name = 'clips/m' + (n < 10 ? '0' : '') + n + '.mp4';
    var my = ++playToken;
    var old = vids[cur];
    var nxt = vids[1 - cur];
    var swapped = false;

    nxt.onplaying = function () {
      if (swapped || my !== playToken) return;
      swapped = true;
      pending = false;
      nxt.classList.add('on');
      old.classList.remove('on');
      try { old.pause(); } catch (e) {}
      cur = 1 - cur;
      playing = true;
      elStage.classList.add('playing');
    };
    nxt.onended = function () { if (nxt === vids[cur] && my === playToken) stopClip(); };
    nxt.onerror = function () { if (my === playToken) pending = false; if (my === playToken && !swapped && !old.classList.contains('on')) stopClip(); };

    nxt.src = name;
    var p = nxt.play();
    if (p && p.catch) p.catch(function () {
      if (my === playToken) pending = false;
      if (my === playToken && !swapped && !old.classList.contains('on')) stopClip();
    });
    setTimeout(function () { if (my === playToken) pending = false; }, 2500); // страховка
  }

  // ---------- Клик ----------
  elStage.addEventListener('pointerdown', function (e) {
    var gain = perClick();
    state.pts += gain;
    state.total += gain;
    floatText(e.clientX + (Math.random() * 30 - 15), e.clientY - 20, fmt(gain));
    elStage.classList.add('hit');
    setTimeout(function () { elStage.classList.remove('hit'); }, 80);
    playRandomClip(); // каждый клик, новый случайный мем
    render();
  });

  document.getElementById('reset').addEventListener('click', function () {
    if (confirm('Сбросить весь прогресс?')) {
      state = fresh();
      save();
      render();
    }
  });

  // ---------- Оффлайн-доход ----------
  (function offline() {
    var dt = Math.min((Date.now() - state.t) / 1000, OFFLINE_CAP_SEC);
    var gain = dt * perSec() * OFFLINE_RATE;
    if (dt > 30 && gain >= 1) {
      state.pts += gain;
      state.total += gain;
      toast('Пока вас не было, набежало очков: ' + fmt(gain));
    }
  })();

  // ---------- Игровой цикл ----------
  var last = Date.now();
  setInterval(function () {
    var now = Date.now();
    var dt = Math.min((now - last) / 1000, 5);
    last = now;
    var g = perSec() * dt;
    if (g > 0) { state.pts += g; state.total += g; }
    render();
  }, 100);

  setInterval(save, 5000);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { save(); vids[0].pause(); vids[1].pause(); playToken++; pending = false; stopClip(); }
  });
  window.addEventListener('pagehide', save);

  render();
})();
</script>
</body>
</html>
