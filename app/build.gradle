plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sliva.clicker'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Постоянный ключ подписи: новые сборки ставятся поверх старых как обновление.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    // Два независимых приложения: у каждого свой applicationId, поэтому
    // установка одного никогда не заменяет другое.
    flavorDimensions 'app'
    productFlavors {
        sliva {
            dimension 'app'
            applicationId 'com.sliva.clicker'
        }
        kussia {
            dimension 'app'
            applicationId 'com.kussia.clicker'
        }
    }

    androidResources {
        noCompress 'mp4', 'jpg'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
