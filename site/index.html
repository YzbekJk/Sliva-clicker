<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Библиотека APK</title>
<style>
  :root{
    --bg:#0d0d0d; --card:#181818; --card2:#222; --text:#f4f4f4; --muted:#9a9a9a; --accent:#ffb703; --line:#2a2a2a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 40px}
  header{margin-bottom:18px}
  h1{margin:0 0 4px;font-size:28px;letter-spacing:-.5px}
  .sub{color:var(--muted);font-size:14px}
  #q{width:100%;margin:16px 0 18px;padding:13px 14px;font:inherit;font-size:16px;color:var(--text);
     background:var(--card);border:1px solid var(--line);border-radius:12px;outline:none}
  #q:focus{border-color:var(--accent)}
  #list{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:620px){#list{grid-template-columns:1fr 1fr}}
  .app{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;
       display:flex;flex-direction:column;gap:12px}
  .top{display:flex;gap:12px;align-items:center}
  .ic{width:64px;height:64px;flex:none;border-radius:16px;background:var(--card2);overflow:hidden;
      display:flex;align-items:center;justify-content:center;font-size:34px}
  .ic img{width:100%;height:100%;object-fit:cover;display:block}
  .name{font-weight:800;font-size:17px}
  .meta{color:var(--muted);font-size:12.5px;margin-top:2px}
  .desc{color:#cfcfcf;font-size:14px;line-height:1.4;flex:1}
  a.dl{display:block;text-align:center;background:var(--accent);color:#2b1a00;font-weight:800;
       font-size:16px;padding:12px;border-radius:12px;text-decoration:none}
  a.dl:active{transform:scale(.98)}
  .empty{color:var(--muted);text-align:center;padding:30px 0}
  .hint{margin-top:26px;padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:13px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📚 Библиотека APK</h1>
    <div class="sub" id="count"></div>
  </header>
  <input id="q" type="search" placeholder="Поиск приложения…" autocomplete="off">
  <div id="list"></div>
  <div class="hint">
    Как установить: скачайте файл, откройте его на телефоне и, если Android спросит, разрешите установку из этого источника.
  </div>
</div>

<script>
(function(){
  var apps=[], list=document.getElementById('list'), q=document.getElementById('q'), cnt=document.getElementById('count');

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function isImg(s){return /\.(jpg|jpeg|png|webp|svg)$/i.test(s)}

  function plural(n){
    var a=n%10,b=n%100;
    if(b>=11&&b<=14)return 'приложений';
    return a===1?'приложение':(a>=2&&a<=4?'приложения':'приложений');
  }

  function render(){
    var t=q.value.trim().toLowerCase();
    var shown=apps.filter(function(a){
      return !t||(a.name+' '+a.desc+' '+(a.tags||'')).toLowerCase().indexOf(t)!==-1;
    });
    cnt.textContent=apps.length+' '+plural(apps.length);
    if(!shown.length){list.innerHTML='<div class="empty">Ничего не найдено</div>';return}
    list.innerHTML=shown.map(function(a){
      var icon=isImg(a.icon)?'<img src="'+esc(a.icon)+'" alt="">':esc(a.icon);
      var meta=['v'+esc(a.version||'1.0')];
      if(a.size_mb)meta.push(a.size_mb+' МБ');
      meta.push('Android');
      return '<div class="app"><div class="top"><div class="ic">'+icon+'</div><div>'+
        '<div class="name">'+esc(a.name)+'</div><div class="meta">'+meta.join(' · ')+'</div></div></div>'+
        '<div class="desc">'+esc(a.desc)+'</div>'+
        '<a class="dl" href="'+esc(a.file)+'" download>Скачать APK</a></div>';
    }).join('');
  }

  q.addEventListener('input',render);
  fetch('apps.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(d){apps=d;render()})
    .catch(function(){list.innerHTML='<div class="empty">Не удалось загрузить список</div>'});
})();
</script>
</body>
</html>
