name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Два независимых приложения (flavors) с разными applicationId
      - name: Build APKs
        run: gradle assembleSlivaDebug assembleKussiaDebug --no-daemon

      - name: Prepare site
        run: |
          mkdir -p public/apks
          cp -r site/. public/
          cp app/build/outputs/apk/kussia/debug/app-kussia-debug.apk public/apks/kussia88-clicker.apk
          cp app/build/outputs/apk/sliva/debug/app-sliva-debug.apk   public/apks/sliva-clicker.apk
          python3 - <<'PY'
          import json, os
          p = 'public/apps.json'
          apps = json.load(open(p, encoding='utf-8'))
          for a in apps:
              f = os.path.join('public', a['file'])
              if os.path.exists(f):
                  a['size_mb'] = round(os.path.getsize(f) / 1048576, 1)
          json.dump(apps, open(p, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print(apps)
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
